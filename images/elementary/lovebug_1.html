<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1600px;height:900px;font-family:"WenQuanYi Zen Hei",sans-serif;background:linear-gradient(160deg,#fff4d6 0%,#ffe2b0 38%,#dff1ea 100%);color:#1f2a2e;overflow:hidden;position:relative}
.sun{position:absolute;top:-120px;left:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#ffd23f 0 45%,rgba(255,196,0,.35) 46% 60%,rgba(255,196,0,0) 61%)}
.wrap{position:absolute;inset:0;padding:34px 60px 46px;display:grid;grid-template-columns:560px 1fr;gap:56px}
.kicker{display:inline-block;background:#1f2a2e;color:#ffd23f;font-size:22px;padding:8px 18px;border-radius:999px;letter-spacing:1px}
h1{font-size:62px;line-height:1.1;margin:14px 0 8px;letter-spacing:-2px}
h1 em{font-style:normal;color:#0f7a5c}
.sub{font-size:25px;line-height:1.45;color:#3b4a4f}
.sub b{color:#c2410c}
.left{position:relative;padding-top:210px}
.phone{position:absolute;left:70px;top:20px;width:400px;height:800px;background:#1f2a2e;border-radius:52px;padding:18px;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.screen{width:100%;height:100%;border-radius:38px;overflow:hidden;background:#f3efe6;position:relative}
.appbar{position:absolute;top:0;left:0;right:0;height:92px;background:#0f7a5c;color:#fff;padding:34px 22px 0;font-size:28px;font-weight:bold}
.appbar small{font-size:17px;font-weight:normal;opacity:.85;margin-left:8px}
.legend{position:absolute;bottom:0;left:0;right:0;background:#fff;padding:16px 22px 22px;font-size:19px;line-height:1.7;border-top:1px solid #e3ddd0}
.legend .row{display:flex;align-items:center;gap:10px}
.sw{width:34px;height:7px;border-radius:4px;display:inline-block}
.right{display:flex;flex-direction:column;gap:18px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}
.card{background:rgba(255,255,255,.88);border-radius:22px;padding:16px 22px;box-shadow:0 6px 18px rgba(0,0,0,.07);position:relative}
.card .n{position:absolute;top:-14px;left:20px;background:#0f7a5c;color:#fff;font-size:20px;font-weight:bold;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.card h3{font-size:25px;margin:8px 0 6px}
.card p{font-size:19px;line-height:1.5;color:#44545a}
.card.hot .n{background:#c2410c}
.stats{display:flex;gap:18px}
.stat{flex:1;background:#1f2a2e;color:#fff;border-radius:22px;padding:12px 22px}
.stat .v{font-size:40px;font-weight:bold;color:#ffd23f;line-height:1.1}
.stat .l{font-size:19px;opacity:.85;margin-top:4px}
.msg{background:#0f7a5c;color:#fff;border-radius:22px;padding:16px 26px;font-size:25px;line-height:1.4}
.msg b{color:#ffd23f}
.src{position:absolute;right:60px;bottom:14px;font-size:14px;color:#6b7a7f}

.phone{position:absolute}
body{word-break:keep-all}
.big{font-size:150px;font-weight:bold;letter-spacing:-4px;line-height:1}
.cover{position:absolute;inset:0;display:flex;align-items:center}
.h2{font-size:60px;font-weight:bold;letter-spacing:-1px}
.col{background:rgba(255,255,255,.9);border-radius:32px;padding:34px 38px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.q{font-size:38px;font-weight:bold;margin-bottom:22px}
.li{display:flex;gap:18px;align-items:flex-start;font-size:33px;line-height:1.45;margin-bottom:26px}
.num{flex:none;width:52px;height:52px;border-radius:50%;color:#fff;font-size:28px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.bubble{position:relative;background:#fff;border-radius:30px;padding:30px 36px;font-size:37px;line-height:1.45;box-shadow:0 8px 22px rgba(0,0,0,.08)}
.who{display:flex;align-items:center;gap:14px;font-size:24px;color:#55656a;margin-top:14px;padding-left:14px}
.av{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:bold}
.tag{display:inline-block;color:#fff;font-size:24px;padding:8px 20px;border-radius:999px;margin-left:16px;vertical-align:middle}

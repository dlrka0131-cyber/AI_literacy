<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리말 속담 사전</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">

<style>
  :root {
    --bg: #fdf8f0;
    --surface: #ffffff;
    --surface-2: #f7efe0;
    --text: #2b2b2b;
    --text-muted: #6b6b6b;
    --accent: #d97706;
    --accent-strong: #92400e;
    --accent-soft: #fef3c7;
    --divider: #ece3d3;
    --shadow: 0 2px 6px rgba(43,33,10,0.06), 0 10px 26px rgba(43,33,10,0.08);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
    padding: 28px 16px 48px;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 1080px;
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 40px;
    align-items: start;
  }

  .sidebar {
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    padding: 8px 6px 8px 2px;
  }

  .content { min-width: 0; }

  header.hero {
    margin-bottom: 22px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--accent-strong);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 4px 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 56px;
    margin-bottom: 18px;
    padding: 0 20px 0 10px;
    background: linear-gradient(100deg, hsl(350, 90%, 88%), hsl(30, 95%, 87%), hsl(52, 95%, 85%), hsl(140, 70%, 86%), hsl(200, 90%, 88%), hsl(265, 85%, 89%));
    color: #4a2f6b;
    border: 2px solid #fff;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(150, 110, 200, 0.28);
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
  }

  .back-btn .arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #fff;
    font-size: 19px;
    line-height: 1;
    box-shadow: 0 2px 6px rgba(74, 47, 107, 0.18);
    transition: transform 0.2s;
  }

  .back-btn:hover {
    transform: translateY(-2px);
    filter: saturate(1.15);
    box-shadow: 0 8px 20px rgba(150, 110, 200, 0.38);
  }
  .back-btn:hover .arrow { transform: translateX(-3px); }
  .back-btn:active { transform: translateY(1px); box-shadow: 0 2px 8px rgba(150, 110, 200, 0.28); }

  h1 {
    font-family: inherit;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: clamp(30px, 6vw, 42px);
    line-height: 1.25;
    margin: 12px 0 8px;
    text-wrap: balance;
  }

  .sub {
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.65;
    max-width: 56ch;
  }

  .controls {
    margin: 0;
  }

  .search-wrap {
    position: relative;
    margin-bottom: 12px;
  }

  .search-wrap svg {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 19px;
    height: 19px;
    color: var(--text-muted);
    pointer-events: none;
  }

  #search {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    padding: 13px 12px 13px 42px;
    border-radius: 14px;
    border: 1.5px solid var(--divider);
    background: var(--surface);
    color: var(--text);
    outline: none;
  }

  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .jump {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .jump button {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    width: 100%;
    font-family: inherit;
    font-size: 18px;
    font-weight: 800;
    height: 54px;
    padding: 0 20px;
    border-radius: 999px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
  }

  .jump button .emoji { font-size: 24px; }

  .jump button:hover { filter: brightness(0.95); }

  .jump button:active { transform: scale(0.96); }

  .jump button.dim { opacity: 0.3; pointer-events: none; }

  .count {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 10px;
  }

  .count strong { color: var(--text); font-variant-numeric: tabular-nums; }

  section.group {
    margin-top: 32px;
    scroll-margin-top: 20px;
  }

  @media (max-width: 860px) {
    .page { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .sidebar { position: static; max-height: none; overflow: visible; padding: 0; }
    .jump { flex-direction: row; flex-wrap: wrap; gap: 8px; }
    .jump button { width: auto; height: 48px; font-size: 16px; }
  }

  .group-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .group-head .glyph {
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
  }

  .group-head .name {
    font-family: inherit;
    font-weight: 800;
    font-size: 20px;
  }

  .group-head .tally {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--surface-2);
    padding: 3px 10px;
    border-radius: 999px;
    margin-left: auto;
  }

  ul.list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li.item {
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 14px;
    align-items: start;
    background: var(--surface);
    border: 1px solid var(--divider);
    border-left: 5px solid var(--divider);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }

  .no {
    flex: none;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    font-weight: 800;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .body-text .proverb {
    font-weight: 700;
    font-size: 18px;
    line-height: 1.55;
  }

  .body-text .meaning {
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.6;
    margin-top: 5px;
  }

  mark {
    background: var(--accent-soft);
    color: var(--accent-strong);
    border-radius: 3px;
    padding: 0 1px;
  }

  .empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 15px;
    padding: 40px 0;
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 40px;
  }

  @media print {
    .page { display: block; }
    .sidebar { display: none; }
    li.item { box-shadow: none; break-inside: avoid; }
  }

  .to-top {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1.5px solid var(--divider);
    background: var(--surface);
    color: var(--accent-strong);
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
  }

  .to-top.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .to-top svg { width: 20px; height: 20px; }

  @media print {
    .to-top, .back-btn { display: none; }
  }
</style>
</head>
<body>

<div class="page">
  <aside class="sidebar">
    <a class="back-btn" href="tooning-storyboard.html"><span class="arrow">←</span>스토리보드로 가기</a>

    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="속담·뜻 검색 (예: 노력)" autocomplete="off">
      </div>
      <div class="jump" id="jump"></div>
      <div class="count" id="count"></div>
    </div>
  </aside>

  <div class="content">
    <header class="hero">
      <span class="eyebrow">주제별 정리</span>
      <h1>우리말 속담 사전</h1>
    </header>

    <main id="main"></main>

    <footer>총 99개 속담 · 라라AI코딩</footer>
  </div>
</div>

<button class="to-top" id="toTop" aria-label="맨 위로">

</button>

    ["하룻강아지 범 무서운 줄 모른다", "철이 없어 두려움 모름"],
    ["한 귀로 듣고 한 귀로 흘린다", "남의 말을 건성으로 듣음"],
    ["한 술 밥에 배 부르랴", "처음에는 큰 성과 기대 어려움"],
    ["함흥차사", "심부름 간 사람이 돌아오지 않음"],
    ["호랑이도 제 말 하면 온다", "이야기하던 사람이 나타남"]
  ].map((d, i) => ({ no: i + 1, proverb: d[0], meaning: d[1] }));

  // 각 속담의 뜻에 따른 주제 분류 (DATA와 같은 순서, 1~99번)
  const CATEGORY_BY_INDEX = [
    3,1,4,2,8,7,9,9,8,9,4,2,8,3,8,9,1,5,1,9,9,9,9,9,9,2,9,3,9,6,9,5,7,6,6,5,6,9,9,4,
    4,8,3,8,4,8,1,6,9,2,7,9,9,9,2,9,1,5,5,9,1,9,9,9,9,5,6,9,9,6,9,1,9,5,9,5,8,6,4,6,
    9,9,9,6,5,8,9,1,2,6,1,9,8,8,4,3,1,9,9
  ];

  const CATEGORIES = [
    { id: 1, name: '노력과 성실', emoji: '💪', color: '#d97706', bg: '#fef3c7' },
    { id: 2, name: '협동과 배려', emoji: '🤝', color: '#16a34a', bg: '#dcfce7' },
    { id: 3, name: '말과 소통', emoji: '💬', color: '#2563eb', bg: '#dbeafe' },
    { id: 4, name: '겸손과 자만 경계', emoji: '🙏', color: '#9333ea', bg: '#f3e8ff' },
    { id: 5, name: '신중함과 지혜', emoji: '🦉', color: '#4338ca', bg: '#e0e7ff' },
    { id: 6, name: '원인과 결과', emoji: '🔄', color: '#db2777', bg: '#fce7f3' },
    { id: 7, name: '욕심 경계', emoji: '💰', color: '#0d9488', bg: '#ccfbf1' },
    { id: 8, name: '역경과 극복', emoji: '⛰️', color: '#dc2626', bg: '#fee2e2' },
    { id: 9, name: '기타', emoji: '📌', color: '#64748b', bg: '#f1f5f9' }
  ];

  // 카테고리 색을 위에서 아래로 무지개 순서(빨강 → 주황 → 노랑 → 초록 → 파랑 → 보라 → 분홍)의 파스텔톤으로 지정
  (function applyRainbow() {
    const hues = [350, 24, 48, 95, 150, 190, 218, 265, 315];
    CATEGORIES.forEach((cat, i) => {
      const h = hues[i];
      cat.bg = 'hsl(' + h + ', 90%, 85%)';     // 파스텔 배경
      cat.line = 'hsl(' + h + ', 75%, 70%)';   // 테두리·강조선
      cat.color = 'hsl(' + h + ', 60%, 26%)';  // 글자색
    });
  })();

  DATA.forEach((d, i) => { d.category = CATEGORY_BY_INDEX[i]; });

  const groupsOrder = CATEGORIES.map(c => c.id);
  const catById = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

  const main = document.getElementById('main');
  const jump = document.getElementById('jump');
  const countEl = document.getElementById('count');
  const search = document.getElementById('search');

  function esc(s) {
    return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function highlight(text, q) {
    if (!q) return esc(text);
    const idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return esc(text);
    return esc(text.slice(0, idx)) + '<mark>' + esc(text.slice(idx, idx + q.length)) + '</mark>' + esc(text.slice(idx + q.length));
  }

  function render(query) {
    const q = (query || '').trim();
    main.innerHTML = '';
    let shown = 0;

    groupsOrder.forEach(g => {
      const items = DATA.filter(d => d.category === g && (
        !q || d.proverb.toLowerCase().includes(q.toLowerCase()) || d.meaning.toLowerCase().includes(q.toLowerCase())
      ));
      if (items.length === 0) return;
      shown += items.length;

      const cat = catById[g];
      const section = document.createElement('section');
      section.className = 'group';
      section.id = 'g-' + g;

      const head = document.createElement('div');
      head.className = 'group-head';
      head.innerHTML =
        '<span class="glyph" style="background:' + cat.bg + '">' + cat.emoji + '</span>' +
        '<span class="name" style="color:' + cat.color + '">' + cat.name + '</span>' +
        '<span class="tally">' + items.length + '개</span>';
      section.appendChild(head);

      const ul = document.createElement('ul');
      ul.className = 'list';
      items.forEach((d, idx) => {
        const li = document.createElement('li');
        li.className = 'item';
        li.style.borderLeftColor = cat.line;
        li.innerHTML =
          '<span class="no" style="background:' + cat.bg + ';color:' + cat.color + '">' + (idx + 1) + '</span>' +
          '<span class="body-text"><span class="proverb">' + highlight(d.proverb, q) + '</span>' +
          '<div class="meaning">' + highlight(d.meaning, q) + '</div></span>';
        ul.appendChild(li);
      });
      section.appendChild(ul);
      main.appendChild(section);
    });

    if (shown === 0) {
      main.innerHTML = '<p class="empty">일치하는 속담이 없습니다.</p>';
    }

    countEl.innerHTML = '<strong>' + shown + '</strong> / 99개 표시 중';

    Array.from(jump.children).forEach(btn => {
      const g = Number(btn.dataset.g);
      const has = DATA.some(d => d.category === g && (!q || d.proverb.toLowerCase().includes(q.toLowerCase()) || d.meaning.toLowerCase().includes(q.toLowerCase())));
      btn.classList.toggle('dim', !has);
    });
  }

  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.innerHTML = '<span class="emoji">' + cat.emoji + '</span><span>' + cat.name + '</span>';
    btn.dataset.g = cat.id;
    btn.style.background = cat.bg;
    btn.style.color = cat.color;
    btn.style.borderColor = cat.line;
    btn.addEventListener('click', () => {
      search.value = '';
      render('');
      const target = document.getElementById('g-' + cat.id);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    jump.appendChild(btn);
  });

  search.addEventListener('input', () => render(search.value));

  const toTop = document.getElementById('toTop');
  window.addEventListener('scroll', () => {
    toTop.classList.toggle('show', window.scrollY > 400);
  });
  toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  render('');
</script>
</body>
</html>
